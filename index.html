<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salary System</title>
<meta name="theme-color" content="#0e7490">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Salary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
<script>
/* =========================================================
 *  Salary System — কর্মচারী, বেতনের হার, হাজিরা (ধাপ ১)
 *  API_URL = Salary System-এর Apps Script ("Anyone" deployment) /exec লিংক।
 *  পেজ public — কোনো গোপন তথ্য নেই; নিরাপত্তা লগইন টোকেন + PIN থেকে।
 * ========================================================= */
var API_URL = 'https://script.google.com/macros/s/AKfycbxK6TuldzYQ9cmT5LOfnmBs9EMZhjSyFweej24acFBfWvfWDIYu0DKe092U14qM7tOp/exec';

// github.io-র সব রিপোজিটরি একই storage ভাগ করতে পারে — তাই সব key-তে "sal_"
var AUTH_KEY = 'sal_auth', BOOT_KEY = 'sal_boot_v1';
var AUTH = '';
try { AUTH = localStorage.getItem(AUTH_KEY) || ''; } catch (e) {}
function setAuth(t) {
  AUTH = t || '';
  try { if (AUTH) localStorage.setItem(AUTH_KEY, AUTH); else { localStorage.removeItem(AUTH_KEY); localStorage.removeItem(BOOT_KEY); } } catch (e) {}
}

var THEME = 'auto';
try { THEME = localStorage.getItem('sal_theme') || 'auto'; } catch (e) {}
function applyTheme() {
  var t = THEME === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : THEME;
  document.documentElement.setAttribute('data-theme', t);
}
applyTheme();

var ORG = 'TECHNIQUE PUBLICATION';
try { var _b = JSON.parse(localStorage.getItem(BOOT_KEY) || 'null'); if (_b && _b.data && _b.data.set) ORG = _b.data.set.org || ORG; } catch (e) {}

/* text/plain POST — preflight ছাড়াই সরাসরি Apps Script-এ */
function callServer(fn, args) {
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args || [], auth: AUTH })
  }).then(function (r) {
    if (!r.ok) throw new Error('সার্ভার সাড়া দিচ্ছে না (' + r.status + ') — একটু পরে আবার চেষ্টা করুন।');
    return r.json().catch(function () { throw new Error('সার্ভারের উত্তর বোঝা যায়নি।'); });
  }, function () {
    throw new Error('সার্ভারে পৌঁছানো যায়নি — ইন্টারনেট সংযোগ দেখুন।');
  }).then(function (j) {
    if (!j || !j.ok) throw new Error((j && j.error) || 'অজানা সমস্যা।');
    return j.data;
  });
}

/* ব্যক্তিগত লোগো "Matra Logic" — Developed By-এর সামনে */
function markSvg(cls) {
  return '<svg class="mk ' + (cls || '') + '" viewBox="0 0 100 100" aria-hidden="true">' +
    '<path d="M8 18H92M16 88 40 18 64 88" fill="none" stroke="url(#mkg)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<path d="M84 18V88" fill="none" stroke="url(#mkg)" stroke-width="9" stroke-linecap="round"/>' +
    '<circle cx="40" cy="64" r="7.5" fill="url(#mkg)"/></svg>';
}
</script>
<style>
:root{
  --bg:#f1f5f9; --card:#ffffff; --ink:#0f1b2d; --ink2:#43536a; --ink3:#8091a7;
  --line:#e2e8f0; --soft:#f3f6fa; --shadow:0 1px 2px rgba(15,27,45,.05),0 8px 24px rgba(15,27,45,.06);
  --acc:#0e7490; --acc-s:rgba(14,116,144,.12); --grad:linear-gradient(135deg,#0f766e,#0e7490 55%,#1d4ed8);
  --pos:#15803d; --neg:#dc2626; --warn:#b45309; --top:rgba(255,255,255,.85);
  --m1:#6366f1; --m2:#8b5cf6; --m3:#d946ef;
  --sP:#16a34a; --sA:#dc2626; --sL:#2563eb; --sU:#d97706; --sH:#9333ea; --sO:#94a3b8;
}
[data-theme=dark]{
  --bg:#0b1220; --card:#131c2e; --ink:#e8eef8; --ink2:#b3c0d4; --ink3:#7889a3;
  --line:#22304a; --soft:#18233a; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  --acc:#22d3ee; --acc-s:rgba(34,211,238,.13); --pos:#4ade80; --neg:#f87171; --warn:#fbbf24; --top:rgba(13,20,34,.85);
  --sP:#4ade80; --sA:#f87171; --sL:#60a5fa; --sU:#fbbf24; --sH:#c084fc; --sO:#64748b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:'Hind Siliguri','Inter','Nirmala UI',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 600px at -5% -10%,rgba(13,148,136,.16),transparent 62%),
             radial-gradient(800px 600px at 105% 0%,rgba(37,99,235,.13),transparent 60%),var(--bg);
  background-attachment:fixed}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
[hidden]{display:none!important}
a{color:var(--acc)}

/* ---------- লগইন ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
  background:radial-gradient(circle at 18% 14%,#0f766e 0,transparent 45%),radial-gradient(circle at 86% 90%,#1d4ed8 0,transparent 42%),#0b1626}
.lg-card{width:100%;max-width:370px;background:#fff;color:#14202f;border-radius:24px;padding:30px 22px 20px;
  box-shadow:0 24px 60px rgba(0,0,0,.45);text-align:center}
.lg-card .ic{width:72px;height:72px;border-radius:20px;display:block;margin:0 auto 12px;box-shadow:0 10px 24px rgba(14,116,144,.3)}
.lg-card h1{font:800 22px 'Plus Jakarta Sans','Inter',sans-serif;letter-spacing:-.02em;margin-bottom:2px}
.lg-card .sub{font-size:13.5px;color:#6b7c93;margin-bottom:20px}
.lg-card label{display:block;text-align:left;font-size:13px;font-weight:700;color:#3c4a5c;margin:0 0 5px}
.lg-card input{width:100%;padding:13px 14px;border:2px solid #dde5ee;border-radius:13px;font:600 16px 'Inter',sans-serif;outline:none;color:#14202f;background:#fff}
.lg-card input:focus{border-color:#0e7490;box-shadow:0 0 0 3px rgba(14,116,144,.15)}
.lg-card input.code{letter-spacing:8px;text-align:center;font-size:22px}
.lg-btn{width:100%;margin-top:12px;padding:14px;border:0;border-radius:13px;color:#fff;font-size:15.5px;font-weight:700;
  background:linear-gradient(135deg,#0f766e,#0e7490 55%,#1d4ed8);box-shadow:0 8px 20px rgba(14,116,144,.35)}
.lg-btn:disabled{opacity:.6;cursor:wait}
.lg-msg{min-height:20px;margin-top:10px;font-size:13px;font-weight:600;color:#c0392b;line-height:1.5}
.lg-msg.ok{color:#2d6a4f}
.lg-link{background:none;border:0;color:#0e7490;font-size:13px;font-weight:700;margin-top:8px}

/* ---------- কাঠামো ---------- */
.shell{min-height:100vh}
.side{display:none}
.topbar{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:var(--top);border-bottom:1px solid var(--line)}
.topbar-in{padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:1}
.brand img{width:40px;height:40px;border-radius:12px;flex:none;box-shadow:0 4px 12px rgba(14,116,144,.25)}
.brand b{display:block;font:800 17px 'Plus Jakarta Sans','Inter',sans-serif;letter-spacing:-.02em;line-height:1.2}
.brand small{display:block;font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{height:40px;min-width:40px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:15px;flex:none}
.ib:hover{border-color:var(--acc)}
.ib:disabled{opacity:.35;cursor:default}
.mob{display:none}
.menu{position:absolute;right:16px;top:58px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:210px;z-index:30}
.menu button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;color:var(--ink);padding:11px 12px;border-radius:9px;font-size:14.5px;text-align:left}
.menu button:hover{background:var(--soft)}
main{padding:16px 16px 96px;max-width:1280px;margin:0 auto}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--top);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.bnav button{border:0;background:none;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;border-radius:12px;font-size:12px;font-weight:600}
.bnav button i{font-style:normal;font-size:19px;line-height:1.2}
.bnav button.on{color:var(--acc);background:var(--acc-s)}
.dev-foot{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;color:var(--ink3);margin:26px 0 4px}
.dev-foot b{font:800 12.5px 'Plus Jakarta Sans','Inter',sans-serif;color:var(--ink2)}
.mk{width:18px;height:18px;flex:none}
@media(min-width:1000px){
  .shell{display:grid;grid-template-columns:250px 1fr}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 14px;border-right:1px solid var(--line);background:var(--top);backdrop-filter:blur(14px)}
  .side .brand{flex:none;margin:0 4px 22px}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side nav button{display:flex;align-items:center;gap:11px;border:0;background:none;color:var(--ink2);padding:11px 12px;border-radius:12px;font-size:15px;font-weight:600;text-align:left}
  .side nav button i{font-style:normal;font-size:18px;width:24px;text-align:center}
  .side nav button:hover{background:var(--soft)}
  .side nav button.on{background:var(--acc-s);color:var(--acc)}
  .side .s-tools{margin-top:auto;display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:12px}
  .side .s-tools button{border:0;background:none;color:var(--ink2);text-align:left;padding:8px 12px;border-radius:10px;font-size:13.5px}
  .side .s-tools button:hover{background:var(--soft)}
  .side .s-me{font-size:12px;color:var(--ink3);padding:4px 12px 8px;overflow-wrap:anywhere}
  .side .s-foot{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink3);padding:10px 12px 0}
  .side .s-foot b{font:800 12px 'Plus Jakarta Sans','Inter',sans-serif;color:var(--ink2)}
  .side .s-foot span{white-space:nowrap;font-size:11px}
  .topbar,.bnav,.dev-foot{display:none}
  main{padding:24px 28px 40px}
}

/* ---------- সাধারণ ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ph h2{font-size:22px;font-weight:700;line-height:1.25}
.ph p{font-size:13.5px;color:var(--ink3);margin-top:2px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h3{font-size:16px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card .hint{font-size:13px;color:var(--ink3);line-height:1.55}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 14px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(14,116,144,.25)}
.btn.red{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 35%,var(--line))}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.55;cursor:default}
.in,.sel{width:100%;min-width:0;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14.5px;outline:none}
.in:focus,.sel:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-s)}
textarea.in{resize:vertical;min-height:120px;font-family:'Inter',monospace;font-size:13px}
.fl{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:12px 0 5px}
.fl em{font-style:normal;font-weight:500;color:var(--ink3)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.seg{display:flex;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1 1 auto;border:0;background:none;color:var(--ink2);padding:8px 10px;border-radius:9px;font-size:13.5px;font-weight:600;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--acc);box-shadow:var(--shadow)}
.days7{display:flex;gap:6px;flex-wrap:wrap}
.days7 button{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:10px;padding:7px 10px;font-size:13.5px;font-weight:600;min-width:52px}
.days7 button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.sw{position:relative;width:44px;height:26px;border-radius:99px;background:var(--line);border:0;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.sw.on{background:var(--acc)} .sw.on::after{left:21px}
.swrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--soft);margin-top:8px}
.swrow span{flex:1;font-size:14px}
.swrow small{display:block;font-size:12px;color:var(--ink3)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.chip b{font-family:'Inter',sans-serif}
.chip.acc{background:var(--acc-s);color:var(--acc)}
.chip.bad{background:color-mix(in srgb,var(--neg) 12%,transparent);color:var(--neg)}
.chip.ok{background:color-mix(in srgb,var(--pos) 13%,transparent);color:var(--pos)}
.chip.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.chip button{border:0;background:none;color:inherit;font-size:13px;padding:0 0 0 2px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0f1b2d;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:92vw;text-align:center}
@media(min-width:1000px){.toast{bottom:28px}}
.sk{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:sh 1.3s infinite;margin:10px 0}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:36px 16px;color:var(--ink3);font-size:14.5px;line-height:1.6}
.err{padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--neg) 9%,transparent);color:var(--neg);font-size:13.5px;line-height:1.5;margin-bottom:12px}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--grad)}

/* ---------- সারাংশ ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:flex;gap:12px;align-items:center;min-width:0}
.stat i{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-style:normal;font-size:19px;background:var(--acc-s);flex:none}
.stat small{display:block;font-size:12.5px;color:var(--ink3)}
.stat b{display:block;font:800 21px 'Inter',sans-serif;line-height:1.25}
.stat b em{font-style:normal;font-size:13px;color:var(--ink3);font-weight:600}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.cols2>.card{margin-bottom:0}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.cols3>.card{margin-bottom:0}
.brow{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;font-size:14px;margin-top:10px}
.brow .bar{height:10px}
.brow b{text-align:right}
.steps{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.steps div{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:9px 11px;border-radius:12px;background:var(--soft)}
.steps div i{font-style:normal}
.steps div small{display:block;font-size:12.5px;color:var(--ink3)}
.steps div.now{background:var(--acc-s)}

/* ---------- কর্মচারী তালিকা ---------- */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tools .in,.tools .sel{width:auto;flex:1 1 160px}
.tools .seg{flex:none}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.lhead,.erow{display:grid;grid-template-columns:70px minmax(0,2fr) 130px minmax(0,1.2fr) minmax(0,1.1fr);gap:12px;align-items:center;padding:11px 16px}
.lhead{font-size:12px;font-weight:700;color:var(--ink3);background:var(--soft);border-bottom:1px solid var(--line)}
.erow{border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.erow:last-child{border-bottom:0}
.erow:hover{background:var(--soft)}
.erow.off{opacity:.55}
.erow b{font-weight:700}
.erow small{display:block;font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow>span{min-width:0}
.eid{font:700 13px 'Inter',sans-serif;color:var(--ink2)}
.tp{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;justify-self:start;white-space:nowrap}
.tp.fixed{background:#e0f2fe;color:#0369a1} .tp.hourly{background:#fef3c7;color:#92400e} .tp.part{background:#ede9fe;color:#6d28d9} .tp.contract{background:#dcfce7;color:#166534}
[data-theme=dark] .tp.fixed{background:#0c3a52;color:#7dd3fc} [data-theme=dark] .tp.hourly{background:#47330c;color:#fcd34d}
[data-theme=dark] .tp.part{background:#33255e;color:#c4b5fd} [data-theme=dark] .tp.contract{background:#123d24;color:#86efac}
.lfoot{padding:10px 16px;font-size:12.5px;color:var(--ink3);border-top:1px solid var(--line)}

/* ---------- শিট / ড্রয়ার ---------- */
.ov{position:fixed;inset:0;background:rgba(8,14,26,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px 22px;overscroll-behavior:contain}
.sheet.wide{max-width:980px}
.sh-h{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-18px;background:var(--card);padding:4px 0 10px;margin-top:-4px;z-index:2}
.sh-h h3{font-size:18px}
.sh-sec{font-size:13px;font-weight:800;color:var(--acc);margin:20px 0 2px;padding-top:14px;border-top:1px dashed var(--line);text-transform:none}
.sh-sec:first-of-type{border-top:0;padding-top:0;margin-top:6px}
.sh-f{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap;position:sticky;bottom:-22px;background:var(--card);padding:12px 0 4px}
.sh-f .grow{flex:1}
@media(min-width:720px){.ov{align-items:center}.sheet{border-radius:22px}}
@media(min-width:1000px){

<script>
(function () {
  var MODE = '', IDLE = 15 * 60000, MINLEN = 4, KEY = 'sal_appLockLast';
  var root = document.documentElement, box = document.getElementById('alLock');
  function $(id) { return document.getElementById(id); }
  function bn(n) { return String(n).replace(/[0-9]/g, function (d) { return '০১২৩৪৫৬৭৮৯'[d]; }); }
  var mode = '', locked = true, busy = false, mem = 0, lastWrite = 0, loginWait = false;
  $('alOrg').textContent = ORG;

  function readLast() { var v = 0; try { v = Number(localStorage.getItem(KEY)) || 0; } catch (e) {} return Math.max(v, mem); }
  function writeLast(t) { mem = t; lastWrite = Date.now(); try { localStorage.setItem(KEY, String(t)); } catch (e) {} }
  function stale() { return Date.now() - readLast() > IDLE; }

  var TEXT = {
    wait:   { sub: '⏳ একটু অপেক্ষা করুন...', a: 'Please Enter the Pin', btn: 'Enter', busy: '', sw: '' },
    unlock: { sub: '', a: 'Please Enter the Pin', btn: 'Enter', busy: 'Logging IN...', sw: '🔑 PIN change?' },
    setup:  { sub: 'নতুন PIN ঠিক করুন — এরপর থেকে Salary System খুলতে এই PIN লাগবে। অন্তত ' + bn(MINLEN) + ' অক্ষর।',
              a: 'New PIN', b: 'Confirm PIN', btn: 'Set PIN', busy: '⏳ সেভ হচ্ছে...', sw: '' },
    change: { sub: 'আগে বর্তমান PIN দিন, তারপর নতুন PIN।',
              a: 'Current PIN', b: 'New PIN', c: 'Confirm new PIN', btn: 'Change PIN', busy: '⏳ যাচাই হচ্ছে...', sw: '← ফিরে যান' }
  };
  function setMode(m) {
    mode = m; var t = TEXT[m];
    $('alSub').textContent = t.sub; $('alBtn').textContent = t.btn; $('alBtn').disabled = m === 'wait';
    $('alLa').textContent = t.a; $('alLb').textContent = t.b || ''; $('alLc').textContent = t.c || '';
    $('alFb').style.display = t.b ? '' : 'none'; $('alFc').style.display = t.c ? '' : 'none';
    $('alSwitch').textContent = t.sw; $('alSwitch').style.display = t.sw ? '' : 'none';
    $('alA').value = $('alB').value = $('alC').value = ''; msg(''); focusA();
  }
  function focusA() { setTimeout(function () { try { $('alA').focus(); } catch (e) {} }, 30); }
  function msg(s, ok) { var e = $('alErr'); e.textContent = s; e.className = 'al-err' + (ok ? ' ok' : ''); }

  function lock() {
    if (!AUTH) { waitForLogin(); return; }
    locked = true; loginWait = false;
    $('alOrg').textContent = ORG;
    root.removeAttribute('data-al-open');
    if (document.activeElement && !box.contains(document.activeElement)) { try { document.activeElement.blur(); } catch (e) {} }
    if (MODE) { setMode(MODE); return; }
    setMode('wait');
    callServer('appLockMode', []).then(function (m) {

      msg(err.message); $('alBtn').disabled = false; $('alBtn').textContent = '🔄 আবার চেষ্টা';
    });
  }
  function unlock() {
    locked = false; loginWait = false; writeLast(Date.now());

  }

  // লগইনের পর সবসময় নিজের PIN (একই ডিভাইসে আরেকজন ঢুকলে আগের জনের খোলা অবস্থা চলবে না)

  window.appLockNow = function () { writeLast(0); mem = 0; lock(); };

  function check() { if (!locked && !loginWait && stale()) lock(); }
  function activity() {
    if (locked || loginWait) return;
    if (stale()) { lock(); return; }
    var n = Date.now(); mem = n;
    if (n - lastWrite > 15000) writeLast(n);
  }
  function run(fn, args, ok) {
    var btn = $('alBtn'), label = btn.textContent;
    busy = true; btn.disabled = true; btn.textContent = TEXT[mode].busy; msg('');
    var done = function () { busy = false; btn.disabled = false; btn.textContent = label; };
    callServer(fn, args).then(function () { done(); ok(); }, function (err) {
      done();
      if (/AUTH_REQUIRED/.test(err.message)) { setAuth(''); window.showLogin && showLogin(); waitForLogin(); return; }
      msg(String(err.message).replace(/^(Exception|Error):\s*/, ''));
      try { $('alA').select(); } catch (e) {}
    });
  }
  $('alForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy) return;
    if (mode === 'wait') { lock(); return; }
    var a = $('alA').value.trim(), b = $('alB').value.trim(), c = $('alC').value.trim();
    if (mode === 'unlock') {
      if (!a) { msg('PIN লিখুন।'); focusA(); return; }
      run('appLockUnlock', [a], unlock);
    } else if (mode === 'setup') {
      if (a.length < MINLEN) { msg('PIN অন্তত ' + bn(MINLEN) + ' অক্ষরের দিন।'); focusA(); return; }
      if (a !== b) { msg('দুইবার একই PIN লিখুন।'); $('alB').focus(); return; }
      run('appLockSetup', [a], function () { MODE = 'unlock'; unlock(); });
    } else {
      if (!a) { msg('বর্তমান PIN লিখুন।'); focusA(); return; }
      if (b.length < MINLEN) { msg('নতুন PIN অন্তত ' + bn(MINLEN) + ' অক্ষরের দিন।'); $('alB').focus(); return; }
      if (b !== c) { msg('নতুন PIN দুইবার একই লিখুন।'); $('alC').focus(); return; }
      run('appLockChange', [a, b], function () { msg('✅ PIN বদলানো হয়েছে।', true); setTimeout(unlock, 900); });
    }
  });
  $('alSwitch').addEventListener('click', function () { if (!busy) setMode(mode === 'change' ? 'unlock' : 'change'); });
  $('alEye').addEventListener('click', function () {
    var on = box.classList.toggle('al-show');
    this.textContent = on ? '🙈 Hide PIN' : '👁 Show PIN'; focusA();
  });
  ['keydown', 'keypress', 'keyup'].forEach(function (t) {
    window.addEventListener(t, function (e) {
      if (locked && !box.contains(e.target)) { e.stopImmediatePropagation(); e.preventDefault(); if (t === 'keydown') focusA(); }
    }, true);
  });
  ['pointerdown', 'mousemove', 'keydown', 'wheel', 'touchstart', 'scroll'].forEach(function (t) {
    document.addEventListener(t, activity, { capture: true, passive: true });
  });
  document.addEventListener('visibilitychange', check);
  window.addEventListener('focus', check);
  window.addEventListener('pagehide', function () { if (!locked && mem) writeLast(mem); });
  setInterval(check, 15000);

  if (!AUTH) waitForLogin();
  else if (!stale()) unlock();
  else lock();
})();
</script>

/* ---------- ছোট সাহায্য ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

/* "০৯১৫", "915", "9.15", "9:15", "5:30 pm" — সব বুঝে HH:mm; am/pm না দিলে নির্ধারিত সময়ের
 * সবচেয়ে কাছেরটা ধরে; যাওয়ার সময়ে after = আসার সময় — তার পরের প্রথমটা (৯টায় এলে "৫:৩০" = বিকাল ৫:৩০, "১০" = সকাল ১০টা) */
function parseTime(v, ref, after) {
  var s = bnDigits(String(v || '')).trim().toLowerCase().replace(/\s+/g, '');
  if (!s) return '';
  var ap = /(am|pm|a|p)$/.exec(s); if (ap) s = s.slice(0, -ap[0].length);
  var h, m;
  var mm = /^(\d{1,2})[:.,;](\d{1,2})$/.exec(s);
  if (mm) { h = +mm[1]; m = +mm[2]; if (mm[2].length === 1) m *= 10; }
  else if (/^\d{1,4}$/.test(s)) {
    if (s.length <= 2) { h = +s; m = 0; }
    else if (s.length === 3) { h = +s[0]; m = +s.slice(1); }
    else { h = +s.slice(0, 2); m = +s.slice(2); }
  } else return null;
  if (m > 59 || h > 24) return null;
  if (h === 24) h = 0;
  if (ap) {
    if (h > 12) return null;
    if (ap[0][0] === 'p' && h < 12) h += 12;
    if (ap[0][0] === 'a' && h === 12) h = 0;
  } else if (h <= 12 && after != null && ((h % 12) * 60 + m >= after || (h % 12) * 60 + m + 720 >= after)) {
    var a1 = (h % 12) * 60 + m;
    h = Math.floor((a1 >= after ? a1 : a1 + 720) / 60);
  } else if (h <= 12 && ref != null) {
    var c1 = (h % 12) * 60 + m, c2 = c1 + 720;
    var d1 = Math.min(Math.abs(c1 - ref), 1440 - Math.abs(c1 - ref)), d2 = Math.min(Math.abs(c2 - ref), 1440 - Math.abs(c2 - ref));
    h = Math.floor((d2 < d1 ? c2 : c1) / 60);
  }
  return pad(h) + ':' + pad(m);
}

/* মাসের সারাংশ — সার্ভারের attSum_/dayMin_/dayLate_ (Data ফাইল)-এর হুবহু একই হিসাব।
 * দুই বেলা চালু থাকলে সকাল (i/o) আর বিকাল (i2/o2) আলাদা — ঘণ্টা দুটোর যোগফল, দেরি দুই বেলারই। */
function attSum(e, month, days) {
  var n = mdays(month), off = e.off || [], grace = Number(S.set.lateGrace) || 0;
  var out = { work: 0, P: 0, A: 0, L: 0, U: 0, H: 0, OW: 0, late: 0, lateMin: 0, min: 0, q: 0 };
  for (var d = 1; d <= n; d++) {
    var date = month + '-' + pad(d);
    if ((e.join && date < e.join) || (e.leave && date > e.leave)) continue;
    var isOff = off.indexOf(wday(month, d)) !== -1 || !!S.holMap[date];
    var x = days[d] || {};
    var s = x.s || (isOff ? 'O' : 'P');
    if (!isOff) out.work++;
    if (s === 'O' || (isOff && s !== 'P' && s !== 'H')) continue;
    out[s]++;
    if (s !== 'P' && s !== 'H') continue;
    if (isOff) out.OW++;
    out.q += Number(x.q) || 0;
    out.min += dayMin(e, x, s);
    var lt = dayLate(e, x, isOff, grace);
    if (lt) { out.late++; out.lateMin += lt; }
  }

}
function sessions(e) {

function dayMin(e, x, s) {

// খাতার পাতা নম্বর ধরে সাজানো (খাতা উল্টানোর ক্রমে); পাতা না থাকলে বিভাগ, তারপর আইডি
function bySheet(a, b) {
  var sa = parseFloat(a.sheet), sb = parseFloat(b.sheet);
  if (!isNaN(sa) || !isNaN(sb)) { if (isNaN(sa)) return 1; if (isNaN(sb)) return -1; if (sa !== sb) return sa - sb; }
  var x = (a.dept || '').localeCompare(b.dept || '', 'bn');
  if (x) return x;
  return /^\d+$/.test(a.id) && /^\d+$/.test(b.id) ? +a.id - +b.id : a.id.localeCompare(b.id);
}

/* ---------- শুরু / লোড ---------- */
function applyBoot(d) {
  S.me = d.me; S.set = d.set || {}; S.emps = d.emps || []; S.rates = d.rates || {}; S.hol = d.hol || []; S.today = d.today || '';

}

function boot() {
  var cached = null;

function ensureAtt(month, force) {
  if (!force && S.attFor === month && S.att) return Promise.resolve(S.att);
  if (S.attLoading === month && S._attP) return S._attP;
  S.attLoading = month; S.attErr = '';

}

function route() {
  var h = location.hash.replace(/^#/, '').split('/');
  var page = PAGES.some(function (p) { return p[0] === h[0]; }) && (!S.booted || pageOk(h[0])) ? h[0] : 'dash';
  var id = page === 'att' && h[1] ? decodeURIComponent(h[1]) : '';

      if (confirm('শেষ বদলগুলো সেভ হয়নি। তবু অন্য পাতায় যাবেন? (না চাপলে এখানেই থাকবেন)')) { S.cur = null; route(); }

    case 'reboot': S.bootErr = ''; boot(); break;
    case 'theme': $('menu').hidden = true; THEME = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('sal_theme', THEME); } catch (e) {} applyTheme(); if (S.page === 'set') render(); break;
    case 'lock': $('menu').hidden = true; flushSave().catch(function () {}).then(function () { if (window.appLockNow) appLockNow(); }); break;
    case 'logout':
      $('menu').hidden = true;
      if (!confirm('এই ডিভাইস থেকে লগআউট করবেন? আবার ঢুকতে ইমেইল কোড লাগবে।')) return;
      flushSave().catch(function () {}).then(function () { return callServer('apiLogout', []); }).catch(function () {}).then(logoutLocal); break;
    case 'security': openSecurity(); break;
    case 'u-new': openUserForm(null); break;
    case 'u-edit': openUserForm(a.getAttribute('data-v')); break;
    case 'u-role': readUserForm(); UF.role = a.getAttribute('data-v'); drawUserForm(); break;
    case 'u-org': case 'u-dept':
      readUserForm();
      var key = act === 'u-org' ? 'orgs' : 'depts', vv = a.getAttribute('data-v'), ix = UF.scope[key].indexOf(vv);
      if (ix === -1) UF.scope[key].push(vv); else UF.scope[key].splice(ix, 1);
      drawUserForm(); break;
    case 'u-save':
      readUserForm();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(UF.email)) { toast('ঠিক ইমেইল লিখুন।'); return; }
      a.disabled = true;
      callServer('apiSaveUser', [{ email: UF.email, name: UF.name, role: UF.role, scope: UF.scope }]).then(function (d) {
        UL = d; closeOv(); drawUsers(); toast('✓ সেভ হয়েছে — এখন ' + UF.email + ' ইমেইল-কোড দিয়ে ঢুকতে পারবেন');
      }, function (err) { a.disabled = false; toast(err.message, 4500); }); break;
    case 'u-rm':
      var em = a.getAttribute('data-v');
      if (!confirm(em + ' — বাদ দেবেন? তাঁর সব লগইনও সাথে সাথে বন্ধ হবে।')) return;
      callServer('apiRemoveUser', [em]).then(function (d) { UL = d; drawUsers(); toast('✓ বাদ দেওয়া হয়েছে'); }, function (err) { toast(err.message, 4500); }); break;
    case 'emp-new': openEmp(null); break;
    case 'emp-open': openEmp(id); break;
    case 'emp-save': saveEmp(); break;
    case 'emp-del':
      if (!confirm(F.e.name + ' — একেবারে মুছে ফেলবেন? (হাজিরা তোলা থাকলে মোছা যাবে না, তখন "বাদ" করুন)')) return;
      callServer('apiDeleteEmployee', [F.e.id]).then(function () {
        var nm = F.e.name; S.emps = S.emps.filter(function (x) { return x.id !== F.e.id; }); delete S.rates[F.e.id];
        saveBootCache(); closeOv(); toast('🗑 ' + nm + ' — মোছা হয়েছে'); render();
      }, function (err) { toast(err.message, 6000); }); break;
    case 'rate-add':
      readEmpForm();
      var am = bnDigits($('nr_amount').value).replace(/[,৳\s]/g, '');
      if (am === '') { toast('নতুন হার লিখুন।'); $('nr_amount').focus(); return; }
      a.disabled = true;
      callServer('apiAddRate', [F.e.id, { from: $('nr_from').value, amount: am, allow: bnDigits($('nr_allow').value).replace(/[,৳\s]/g, ''), note: $('nr_note').value }]).then(function (rs) {
        S.rates[F.e.id] = rs; saveBootCache(); drawEmpForm(); toast(can('rate') === 'direct' ? '✓ নতুন হার যোগ হয়েছে' : '✓ প্রস্তাব পাঠানো হয়েছে — মালিকের অনুমোদনের অপেক্ষায়'); refreshEmpList();
      }, function (err) { a.disabled = false; toast(err.message, 4500); }); break;
    case 'rate-ok': case 'rate-no':
      var okR = act === 'rate-ok', rid0 = a.getAttribute('data-rid');
      if (!okR && !confirm('প্রস্তাবটা বাতিল করবেন?')) return;
      if (F) readEmpForm();
      a.disabled = true;
      callServer('apiDecideRate', [rid0, okR]).then(function (rs) {
        S.rates[id] = rs; saveBootCache(); toast(okR ? '✓ অনুমোদন হয়েছে — হার চালু' : '✕ প্রস্তাব বাতিল হয়েছে');
        if (F && $('empForm')) drawEmpForm(); render();
      }, function (err) { a.disabled = false; toast(err.message, 4500); }); break;
    case 'rate-del':
      if (!confirm('এই হারটা মুছবেন / প্রস্তাবটা তুলে নেবেন?')) return;
      readEmpForm();
      callServer('apiDeleteRate', [a.getAttribute('data-rid')]).then(function (rs) {
        S.rates[F.e.id] = rs; saveBootCache(); drawEmpForm(); refreshEmpList();
      }, function (err) { toast(err.message, 4500); }); break;
    case 'import': openImport(); break;
    case 'imp-tpl':
      var line = IMP_COLS.map(function (c) { return c[1]; }).join('\t');
      (navigator.clipboard ? navigator.clipboard.writeText(line) : Promise.reject()).then(function () { toast('✓ কপি হয়েছে — এক্সেলের প্রথম সারিতে পেস্ট করুন'); }, function () { prompt('কপি করুন:', line); }); break;
    case 'imp-save': saveImport(); break;

    case 'm-prev': changeMonth(-1); break;
    case 'm-next': changeMonth(1); break;
    case 'att-reload': S.attErr = ''; ensureAtt(S.month, true).then(route, function () {}); break;
    case 'att-open': go('#att/' + encodeURIComponent(id)); break;
    case 'ent-back': go('#att'); break;
    case 'ent-prev': entryNav(-1); break;
    case 'ent-next': case 'ent-next2': entryNav(1); break;
    case 'ent-done':
      var e = empById(S.cur.id);
      if (e && qtyOn(e) && !S.cur.qty && !attSum(e, S.cur.month, S.cur.days).q && !confirm('এ মাসে মোট ' + qtyWord(e) + ' ০ — তবু শেষ করবেন?')) return;
      a.disabled = true;
      doSave(true).then(function () { entryNav(1, true); }, function (err) { a.disabled = false; toast(err.message.replace(/^CONFLICT:\s*/, ''), 5000); }); break;
    case 'ent-undone':
      doSave(false).then(function () { render(); }, function (err) { toast(err.message, 5000); }); break;
    case 't-tog': S.timeOn = !timeOn(empById(S.cur.id)); render(); break;
    case 'ent-reset':
      if (!confirm('এই মাসের সব ব্যতিক্রম মুছে পুরো মাস নির্ধারিত সময়ে উপস্থিত ধরবেন?')) return;
      S.cur.days = {}; render(); markDirty(); break;
    case 'sel-on': S.sel = {}; refreshAttList(); break;
    case 'sel-off': S.sel = null; refreshAttList(); break;
    case 'sel-tog': if (S.sel[id]) delete S.sel[id]; else S.sel[id] = 1; refreshAttList(); break;
    case 'sel-all': attEmps().forEach(function (x) { S.sel[x.id] = 1; }); refreshAttList(); break;
    case 'sel-done': bulkDone(true); break;
    case 'sel-undone': bulkDone(false); break;

    case 's-org': saveSet({ org: $('s_org').value }); break;
    case 's-inst-add':
      var ni = $('s_inst').value.trim(); if (!ni) return;
      saveSet({ orgs: orgs().concat([ni]) }, '✓ প্রতিষ্ঠান যোগ হয়েছে'); break;
    case 's-inst-rm':
      var oi = orgs().slice(), on = oi[+a.getAttribute('data-i')];
      if (S.emps.some(function (x) { return x.org === on; }) && !confirm(on + ' — এই প্রতিষ্ঠানে কর্মচারী আছে। তালিকা থেকে বাদ দিলেও তাঁদের তথ্যে নামটা থেকে যাবে। বাদ দেবেন?')) return;
      oi.splice(+a.getAttribute('data-i'), 1); saveSet({ orgs: oi }); break;
    case 's-dept-add':
      var nd = $('s_dept').value.trim(); if (!nd) return;
      saveSet({ depts: (S.set.depts || []).concat([nd]) }, '✓ বিভাগ যোগ হয়েছে'); break;
    case 's-dept-rm':
      var ds = (S.set.depts || []).slice(); ds.splice(+a.getAttribute('data-i'), 1); saveSet({ depts: ds }); break;
    case 's-sched': saveSet({ defIn: $('s_in').value, defOut: $('s_out').value, defBrk: bnDigits($('s_brk').value) || 0, defOff: days7Val('s_off') }); break;
    case 's-late':
      var rb = document.querySelector('[data-fseg="lateRule"] button.on');
      saveSet({ lateRule: rb ? rb.getAttribute('data-v') : 'count', lateGrace: bnDigits($('s_grace').value) || 0, lateCount: bnDigits($('s_lcount').value) || 1, lateTk: bnDigits($('s_ltk').value) || 0 }); break;
    case 'hy-prev': S.holYear = (S.holYear || +todayStr().slice(0, 4)) - 1; render(); break;
    case 'hy-next': S.holYear = (S.holYear || +todayStr().slice(0, 4)) + 1; render(); break;
    case 'h-add':
      var hf = $('h_from').value, ht = $('h_to').value || hf, hn = $('h_name').value.trim();
      if (!hf) { toast('তারিখ দিন।'); return; } if (!hn) { toast('ছুটির নাম লিখুন।'); $('h_name').focus(); return; }
      a.disabled = true;
      callServer('apiSaveHolidays', [hf, ht, hn]).then(function (h) {
        S.hol = h; setHolMap(); S.holYear = +hf.slice(0, 4); saveBootCache(); toast('✓ ছুটির দিন যোগ হয়েছে'); render();
      }, function (err) { a.disabled = false; toast(err.message, 4500); }); break;
    case 'h-del':
      if (!confirm(dateLabel(a.getAttribute('data-d')) + ' — ছুটির দিনটা মুছবেন?')) return;
      callServer('apiDeleteHoliday', [a.getAttribute('data-d')]).then(function (h) { S.hol = h; setHolMap(); saveBootCache(); render(); }, function (err) { toast(err.message, 4500); }); break;
    case 'log':
      $('logBox').innerHTML = '<div class="sk"></div>';
      callServer('apiLog', [80]).then(function (l) {
        $('logBox').innerHTML = l.length ? l.map(function (x) { return '<div><small>' + esc(x.at) + ' · ' + esc(x.by) + '</small><br><b>' + esc(x.act) + '</b> — ' + esc(x.detail) + '</div>'; }).join('') : '<p class="hint">এখনো কিছু নেই।</p>';
      }, function (err) { $('logBox').innerHTML = '<div class="err">' + esc(err.message) + '</div>'; }); break;
  }
});
document.addEventListener('input', function (ev) {
  var t = ev.target;
  if (t.id === 'efQ') { S.ef.q = t.value; refreshEmpList(); }
  else if (F && /^f_(tin|tout|tin2|tout2|brk)$/.test(t.id)) { readEmpForm(); if ($('f_hrs')) $('f_hrs').innerHTML = hrsTxt(F.e); }
});
document.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t.id === 'efDept') { S.ef.dept = t.value; refreshEmpList(); }
  else if (t.id === 'efType') { S.ef.type = t.value; refreshEmpList(); }
  else if (t.id === 'efOrg') { S.ef.org = t.value; refreshEmpList(); }
  else if (t.id === 'afOrg') { S.af.org = t.value; refreshAttList(); }
});
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape' && $('ov')) closeOv();
  if (ev.key === 'Enter' && ev.target.id === 's_dept') { ev.preventDefault(); document.querySelector('[data-a="s-dept-add"]').click(); }
  if (ev.key === 'Enter' && ev.target.id === 's_inst') { ev.preventDefault(); document.querySelector('[data-a="s-inst-add"]').click(); }
});
$('menuBtn').addEventListener('click', function (e) { e.stopPropagation(); $('menu').hidden = !$('menu').hidden; });
window.addEventListener('beforeunload', function (e) { if (S.cur && (S.cur.dirty || S.cur.saving)) { e.preventDefault(); e.returnValue = ''; } });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (THEME === 'auto') applyTheme(); });

/* ---------- লগইন ---------- */
var LG = { email: '' };
function showLogin() {
  $('app').hidden = true; $('login').hidden = false;
  $('lgOrg').textContent = ORG + ' — বেতন হিসাব';
  lgStep(1);
  if (window.appLockWaitLogin) appLockWaitLogin();
}
function showApp() {
  $('login').hidden = true; $('app').hidden = false;
  boot();
}
function lgStep(n) {
  $('lgStep1').hidden = n !== 1; $('lgStep2').hidden = n !== 2; $('lgBack').hidden = n !== 2;
  $('lgBtn').textContent = n === 1 ? 'কোড পাঠান' : 'লগইন';
  lgMsg(n === 2 ? LG.email + ' — ইনবক্সে কোড গেছে (Spam-ও দেখুন)।' : '', true);
  setTimeout(function () { (n === 1 ? $('lgEmail') : $('lgCode')).focus(); }, 30);
}
function lgMsg(m, ok) { var e = $('lgMsg'); e.textContent = m; e.className = 'lg-msg' + (ok ? ' ok' : ''); }
function device() {
  var u = navigator.userAgent;
  var os = /Android/.test(u) ? 'Android' : /iPhone|iPad/.test(u) ? 'iPhone' : /Windows/.test(u) ? 'Windows' : /Mac/.test(u) ? 'Mac' : 'অন্য';
  var br = /Edg\//.test(u) ? 'Edge' : /Chrome\//.test(u) ? 'Chrome' : /Firefox\//.test(u) ? 'Firefox' : /Safari\//.test(u) ? 'Safari' : 'Browser';
  return os + ' · ' + br;
}
$('lgForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var btn = $('lgBtn'); if (btn.disabled) return;
  var step1 = !$('lgStep1').hidden;
  var done = function () { btn.disabled = false; btn.textContent = step1 ? 'কোড পাঠান' : 'লগইন'; };
  if (step1) {
    var em = $('lgEmail').value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { lgMsg('ঠিক ইমেইল লিখুন।'); return; }
    btn.disabled = true; btn.textContent = '⏳ পাঠানো হচ্ছে…'; lgMsg('');
    callServer('apiSendCode', [em]).then(function () { LG.email = em; done(); lgStep(2); }, function (err) { done(); lgMsg(err.message); });
  } else {
    var code = $('lgCode').value.replace(/\D/g, '');
    if (code.length !== 6) { lgMsg('৬ সংখ্যার কোড লিখুন।'); return; }
    btn.disabled = true; btn.textContent = '⏳ যাচাই হচ্ছে…'; lgMsg('');
    callServer('apiVerifyCode', [LG.email, code, device()]).then(function (tok) {
      done(); setAuth(tok); $('lgCode').value = '';
      showApp();
      if (window.appLockAfterLogin) appLockAfterLogin();
    }, function (err) { done(); lgMsg(err.message); });
  }
});
$('lgBack').addEventListener('click', function () { lgStep(1); });

function logoutLocal() {
  setAuth(''); S.booted = false; S.cur = null; S.att = null; S.attFor = ''; closeOv();
  showLogin();
}

/* ---------- শুরু ---------- */
if (AUTH) showApp(); else showLogin();
</script>
</body>
</html>
